controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    admittance_controller:
      type: ros2_control_demo_example_16/AdmittanceController


force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: tcp_fts_sensor
    frame_id: ft_frame


admittance_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position
      - velocity

    state_interfaces:
      - position
      - velocity

    # Force-torque sensor configuration
    ft_sensor:
      name: tcp_fts_sensor

    # Kinematics configuration
    kinematics:
      base: base_link
      tip: tool0

    # Admittance parameters for 6 axes [x, y, z, rx, ry, rz]
    admittance:
      selected_axes:
        - true   # x
        - true   # y
        - true   # z
        - true   # rx
        - true   # ry
        - true   # rz

      # Virtual mass (kg or kg*m^2 for rotation)
      mass:
        - 5.0
        - 5.0
        - 5.0
        - 0.5
        - 0.5
        - 0.5

      # Damping coefficient (Ns/m or Nms/rad)
      damping:
        - 50.0
        - 50.0
        - 50.0
        - 5.0
        - 5.0
        - 5.0

      # Stiffness (N/m or Nm/rad)
      stiffness:
        - 200.0
        - 200.0
        - 200.0
        - 20.0
        - 20.0
        - 20.0
